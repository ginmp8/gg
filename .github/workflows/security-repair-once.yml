name: One-time security dependency repair

on:
  push:
    branches:
      - feature/tauri-desktop

permissions:
  contents: write

jobs:
  repair:
    # Temporary, one-shot, owner-only migration. Remove this workflow after
    # resolving the package versions and reviewing the generated diff.
    if: >-
      github.repository == 'ginmp8/gita' &&
      github.ref == 'refs/heads/feature/tauri-desktop' &&
      github.actor == 'ginmp8' &&
      github.event.head_commit.message == 'chore(security): stage one-time dependency repair'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/tauri-desktop
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - name: Verify original dependency installation
        run: npm ci
      - name: Apply explicit security-version updates
        shell: bash
        run: |
          set -euo pipefail
          npm install --workspace @gita/api --save-exact fastify@5.12.8 zod@4.6.7 --ignore-scripts
          npm install --workspace @gita/db --save-exact drizzle-orm@0.45.4 zod@4.6.7 --ignore-scripts
          npm install --workspace @gita/core --save-exact zod@4.6.7 --ignore-scripts
          npm install --workspace @gita/web --save-exact echarts@6.1.0 --ignore-scripts
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = {
            ...pkg.overrides,
            next: {
              ...pkg.overrides?.next,
              postcss: '^8.5.23'
            }
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          # Remediate compatible transitive packages. Final audit below is
          # authoritative; this command's status is not a release decision.
          npm audit fix --omit=dev --ignore-scripts || true
      - name: Install exact candidate lockfile
        run: npm ci
      - name: Run unchanged validation gates
        shell: bash
        run: |
          set -euo pipefail
          npm run desktop:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit only validated dependency manifests and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add -- package.json package-lock.json apps/api/package.json apps/web/package.json packages/db/package.json packages/core/package.json
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix(security): upgrade vulnerable production dependencies"
          git push origin HEAD:refs/heads/feature/tauri-desktop
