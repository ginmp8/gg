name: Refresh GG Analytics screenshots

on:
  push:
    branches: [development]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/gg-screenshots.mjs"
      - "assets/gg-desktop-icon.svg"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

concurrency:
  group: gg-analytics-screenshots-development
  cancel-in-progress: true

jobs:
  capture:
    # Generate reviewable screenshot artifacts without modifying the PR branch.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GG_OFFLINE: "1"
      GG_DATA_DIR: /tmp/gg-analytics-screenshots-data
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out development
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for reproducible screenshots
        run: npx playwright install --with-deps chromium
      - name: Build production web frontend (without Next.js development overlays)
        run: npm --workspace @gg/web run build
      - name: Run API and production web, then capture actual UI
        shell: bash
        run: |
          npm --workspace @gg/api run dev > "$RUNNER_TEMP/gg-analytics-api.log" 2>&1 &
          api_pid=$!
          (cd apps/web && node ../../scripts/next.mjs start -H 127.0.0.1 -p 4444) > "$RUNNER_TEMP/gg-analytics-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          node scripts/gg-screenshots.mjs || {
            echo "::error::Screenshot capture failed; inspect the API and web logs below."
            tail -n 120 "$RUNNER_TEMP/gg-analytics-api.log"
            tail -n 120 "$RUNNER_TEMP/gg-analytics-web.log"
            exit 1
          }
      - name: Package screenshot changes without creating bot commits
        shell: bash
        run: |
          # PR updates made with GITHUB_TOKEN require workflow approval.
          # Keep CI automatic: publish the screenshots and binary patch instead.
          git diff --binary -- assets/app.png assets/contributors.png assets/files.png > assets/gg-screenshots.patch
          if test -s assets/gg-screenshots.patch; then
            echo "::notice::Generated screenshots differ from the checked-in assets. Download this run's artifact and apply gg-screenshots.patch in a regular maintainer commit."
          else
            echo "Screenshots match the checked-in assets."
          fi
      - name: Upload screenshots and optional patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gg-analytics-screenshots
          path: |
            assets/app.png
            assets/contributors.png
            assets/files.png
            assets/gg-screenshots.patch
          if-no-files-found: error
          retention-days: 14
