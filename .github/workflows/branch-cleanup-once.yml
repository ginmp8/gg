name: Consolidated branch cleanup (one-time)

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  delete-merged-branches:
    # Not a reusable administration workflow: only the uniquely named
    # operator-authorized commit on the target repository can execute it.
    if: "${{ github.repository == 'ginmp8/gita' && github.ref == 'refs/heads/development' && github.event.head_commit.message == 'chore(repo): clean up consolidated branches' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify and remove only fully-integrated branches
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/development"
          test "${GH_REPO}" = "ginmp8/gita"
          actual_dev="$(gh api "repos/${GH_REPO}/git/ref/heads/development" --jq '.object.sha')"
          test "${actual_dev}" = "${GITHUB_SHA}"

          branches=(
            "feature/tauri-desktop|9c279ef1789c6458eb91d16f4955e511448fc531"
            "fix/refresh-registered-remote|9bdfbdce97235cfc8773eb70ecdfadcc88df98f0"
            "security/offline-default-20261105|46caf836ba40595c4abbad648b3963d5c621f478"
          )

          # Check all three before deleting even one. Never delete main or
          # development. If any ref moved, stop rather than deleting user work.
          for entry in "${branches[@]}"; do
            name="${entry%%|*}"
            expected="${entry#*|}"
            case "${name}" in
              main|development) echo "Refuse protected name" >&2; exit 1 ;;
            esac
            actual="$(gh api "repos/${GH_REPO}/git/ref/heads/${name}" --jq '.object.sha')"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "Ref changed: ${name}; aborting all cleanup." >&2
              exit 1
            fi
            behind="$(gh api "repos/${GH_REPO}/compare/${expected}...${GITHUB_SHA}" --jq '.behind_by')"
            if [[ "${behind}" != "0" ]]; then
              echo "Ref not fully integrated: ${name}; aborting." >&2
              exit 1
            fi
            echo "Verified ${name} at ${expected}"
          done

          for entry in "${branches[@]}"; do
            name="${entry%%|*}"
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${name}" >/dev/null
            echo "Deleted ${name}"
          done

          remaining="$(gh api "repos/${GH_REPO}/branches?per_page=100" --jq '.[].name' | LC_ALL=C sort)"
          expected_remaining="$(printf 'development\nmain' | LC_ALL=C sort)"
          if [[ "${remaining}" != "${expected_remaining}" ]]; then
            echo "Branch inventory mismatch after cleanup:" >&2
            printf '%s\n' "${remaining}" >&2
            exit 1
          fi
          echo "Confirmed only main and development remain."
